name: Backend CI

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpass
                    POSTGRES_DB: zevra_test
                # check if postgresql is ready before doing tests
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '21'
            
            - run: chmod +x mvnw
              working-directory: zevra

            - run: ./mvnw test -Dtest=ZevraApplicationTests
              working-directory: zevra
              env:
                DB_URL: jdbc:postgresql://localhost:5432/zevra_test
                DB_USERNAME: testuser
                DB_PASSWORD: testpass
                DB_MAX_POOL_SIZE: 5
                JWT_SECRET: MySecretKey12345678901234567890
                JWT_EXPIRATION: 86400000
                SPRING_FLYWAY_ENABLED: false
